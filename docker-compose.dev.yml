version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: stock-downloader-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    networks:
      - stock-network-dev

  # API网关
  api-gateway:
    build:
      context: ./microservices
      dockerfile: api-gateway/Dockerfile
    container_name: stock-downloader-gateway-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    volumes:
      - ./microservices:/app
      - ./logs/gateway:/app/logs
    networks:
      - stock-network-dev
    profiles:
      - dev

  # 下载服务
  download-service:
    build:
      context: ./microservices
      dockerfile: download-service/Dockerfile
    container_name: stock-downloader-download-dev
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=download-service
      - SERVICE_PORT=8001
      - BROWSER_STRATEGY=playwright
      - HEADLESS=true
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    volumes:
      - ./microservices:/app
      - ./downloads:/app/downloads
      - ./cache:/app/cache
      - ./logs/download:/app/logs
      - /tmp/.X11-unix:/tmp/.X11-unix  # For GUI debugging
    networks:
      - stock-network-dev
    profiles:
      - dev
    # 添加权限以处理文件操作
    user: root

  # 缓存服务
  cache-service:
    build:
      context: ./microservices
      dockerfile: cache-service/Dockerfile
    container_name: stock-downloader-cache-dev
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=cache-service
      - SERVICE_PORT=8002
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    volumes:
      - ./microservices:/app
      - ./logs/cache:/app/logs
    networks:
      - stock-network-dev
    profiles:
      - dev

  # 错误服务
  error-service:
    build:
      context: ./microservices
      dockerfile: error-service/Dockerfile
    container_name: stock-downloader-error-dev
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=error-service
      - SERVICE_PORT=8003
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    volumes:
      - ./microservices:/app
      - ./logs/error:/app/logs
    networks:
      - stock-network-dev
    profiles:
      - dev

  # 配置服务
  config-service:
    build:
      context: ./microservices
      dockerfile: config-service/Dockerfile
    container_name: stock-downloader-config-dev
    ports:
      - "8004:8004"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=config-service
      - SERVICE_PORT=8004
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    volumes:
      - ./microservices:/app
      - ./logs/config:/app/logs
    networks:
      - stock-network-dev
    profiles:
      - dev

  # 开发工具 - Redis命令行界面
  redis-cli:
    image: redis:7-alpine
    container_name: stock-downloader-redis-cli-dev
    command: redis-cli -h redis
    depends_on:
      - redis
    networks:
      - stock-network-dev
    profiles:
      - tools

  # 开发工具 - 数据库管理器
  redis-admin:
    image: rediscommander/redis-commander:latest
    container_name: stock-downloader-redis-admin-dev
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - stock-network-dev
    profiles:
      - tools

volumes:
  redis_data_dev:
    driver: local

networks:
  stock-network-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16