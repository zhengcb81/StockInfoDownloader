[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short --capture=sys -m "not live"
markers =
    unit: isolated owner behavior
    contract: executable protocol and architectural boundaries
    e2e_offline: real subprocess or HTTP against an isolated local fixture
    regression: a previously broken production behavior
    live: explicitly opt-in real CNINFO network access
    windows_only: requires native Windows file sharing semantics
