[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_* *_test
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-fail-under=0
    --cov-config=.coveragerc
    --ignore=tests/integration/
    --ignore=tests/regression/
    --ignore=tests/test_performance.py
    --ignore=tests/unit/test_basic.py
    --ignore=tests/unit/test_org_id_validation.py

norecursedirs = 
    .*
    cache 
    downloads 
    logs 
    microservices 
    nginx 
    test_downloads 
    test_reports
    expected_results
    __pycache__

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
    regression: Regression tests
    slow: Slow running tests
    network: Tests requiring network access
    browser: Tests requiring browser
    selenium: Tests using Selenium
    playwright: Tests using Playwright
    long: Long running tests

[coverage:run]
source = src
branch = True
omit =
    */test_*.py
    */tests/*.py
    */__pycache__/*
    */setup.py
    */conftest.py
    */version.py
    */migrations/*.py
    */test_execution_monitor.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\b:
ignore_errors = True
show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
title = StockInfoDownloader Coverage Report
skip_covered = True

[coverage:xml]
output = coverage.xml