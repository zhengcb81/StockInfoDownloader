name: SID adapter contracts

on:
  push:
    branches: [v2-clean-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # The G4 fixture exercises this published consumer against local HTTP.
      G4_CWP_COMMIT: ce89127b6ba1878935e2dd1e17b065e4153c88af
      G4_CWP_REPO: ${{ github.workspace }}/_cwp_consumer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zhengcb81/company-wiki
          ref: ${{ env.G4_CWP_COMMIT }}
          path: _cwp_consumer
          persist-credentials: false
          sparse-checkout: |
            src/company_wiki
            config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt PyYAML
      - name: Verify source and typed contracts
        if: runner.os == 'Linux'
        run: |
          python -m pip install ruff==0.15.18 mypy==1.19.0
          python -m ruff check --no-cache --select E9,F63,F7,F82 src main.py tests tools
          python -m mypy --python-version 3.10 src/acquisition_budget.py src/models.py src/transport_states.py
      - name: Run all admitted offline SID tests
        run: python -m tools.run_offline_ci --revision "${{ env.TEST_REVISION }}" --evidence-dir "${{ runner.temp }}/sid-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-offline-${{ matrix.os }}
          path: ${{ runner.temp }}/sid-evidence/*.json
          if-no-files-found: error
