name: SID adapter contracts

on:
  push:
    branches: [v2-clean-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Test SID logging, adapter wire and owner diagnostics
        env:
          RESEARCH_FEEDBACK_STATE_ROOT: ${{ runner.temp }}/sid-feedback
        run: >-
          python -m pytest -q -o addopts="" --tb=short
          tests/unit/test_s5_adapter_logging.py
          tests/unit/test_s1_logging_and_browser_errors.py
          tests/unit/test_company_wiki_adapter_cli.py
          tests/unit/test_company_wiki_adapter_cli_budget.py
          tests/unit/test_feedback_observation.py
          tests/unit/test_feedback_owner.py
          tests/unit/test_provider_error_contract.py::test_failure_document_is_the_last_stderr_line_even_after_cleanup_logs
          tests/unit/test_f4_start_input.py::TestEntryReadFailures::test_unexpected_config_error_keeps_its_traceback
