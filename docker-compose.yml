version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: stock-downloader-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network

  # API网关
  api-gateway:
    build:
      context: ./microservices
      dockerfile: api-gateway/Dockerfile
    container_name: stock-downloader-gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./microservices:/app
      - gateway_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/gateway/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network
    restart: unless-stopped

  # 下载服务 (Microservice Mode)
  # 注意：微服务架构为可选部署模式，单机模式为默认推荐配置
  download-service:
    build:
      context: ./microservices
      dockerfile: download-service/Dockerfile
    container_name: stock-downloader-download
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=download-service
      - SERVICE_PORT=8001
      - BROWSER_STRATEGY=playwright
      - HEADLESS=true
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./microservices:/app
      - ./downloads:/app/downloads
      - ./cache:/app/cache
      - download_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network
    restart: unless-stopped
    # 添加权限以处理文件操作
    user: root

  # 缓存服务
  cache-service:
    build:
      context: ./microservices
      dockerfile: cache-service/Dockerfile
    container_name: stock-downloader-cache
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=cache-service
      - SERVICE_PORT=8002
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./microservices:/app
      - cache_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/cache/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network
    restart: unless-stopped

  # 错误服务
  error-service:
    build:
      context: ./microservices
      dockerfile: error-service/Dockerfile
    container_name: stock-downloader-error
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=error-service
      - SERVICE_PORT=8003
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./microservices:/app
      - error_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network
    restart: unless-stopped

  # 配置服务
  config-service:
    build:
      context: ./microservices
      dockerfile: config-service/Dockerfile
    container_name: stock-downloader-config
    ports:
      - "8004:8004"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=config-service
      - SERVICE_PORT=8004
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./microservices:/app
      - config_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stock-network
    restart: unless-stopped

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-downloader-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - stock-network
    restart: unless-stopped

  # Grafana可视化
  grafana:
    image: grafana/grafana:latest
    container_name: stock-downloader-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - stock-network
    restart: unless-stopped

  # Nginx负载均衡器
  nginx:
    image: nginx:alpine
    container_name: stock-downloader-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api-gateway
    networks:
      - stock-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  gateway_logs:
    driver: local
  download_logs:
    driver: local
  cache_logs:
    driver: local
  error_logs:
    driver: local
  config_logs:
    driver: local

networks:
  stock-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16